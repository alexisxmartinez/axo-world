name: CI
on:
  pull_request:
  push:
jobs:
  blocklist:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Check added lines for internal identifiers
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$EVENT_NAME" = pull_request ]; then
            BASE_SHA=$(git merge-base "$BASE_SHA" "$HEAD_SHA")
          elif [ "$BASE_SHA" = 0000000000000000000000000000000000000000 ]; then
            if [ "$GITHUB_REF_NAME" = "$DEFAULT_BRANCH" ]; then
              BASE_SHA=$(git hash-object -t tree /dev/null)
            else
              BASE_SHA=$(git merge-base "origin/$DEFAULT_BRANCH" "$HEAD_SHA")
            fi
          elif ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
            git fetch --no-tags origin "$BASE_SHA"
          fi
          sh .githooks/pre-commit --range "$BASE_SHA" "$HEAD_SHA"
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm run build
      - run: npm test
